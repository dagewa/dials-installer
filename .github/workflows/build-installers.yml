name: Build installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: DIALS version to build
        required: true
        default: 3.30.1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: macOS x86_64
            os: macos-26-intel
          - name: macOS arm64
            os: macos-latest
          - name: Windows x86_64
            os: windows-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch DIALS LICENSE
        env:
          DIALS_VERSION: ${{ inputs.version }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/dials/dials/v${DIALS_VERSION}/LICENSE" -o LICENSE

      - name: Set up conda with constructor
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true

      # `conda build` is a subcommand plugin of whichever conda is on PATH, so
      # conda-build has to go into base; constructor is a plain executable and
      # goes into the activated environment.
      - name: Install constructor and conda-build
        run: |
          conda install -y -n base conda-build
          conda install -y constructor

      # construct.yaml reads DIALS_LAUNCHER_CHANNEL, so the installer takes
      # dials-launcher from the package built below rather than from
      # anaconda.org. Windows needs a drive-letter file:///D:/... URL.
      - name: Locate local channel
        run: |
          dir="${RUNNER_TEMP}/local-channel"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            url="file:///$(cygpath -m "${dir}")"
          else
            url="file://${dir}"
          fi
          echo "LOCAL_CHANNEL_DIR=${dir}" >> "${GITHUB_ENV}"
          echo "DIALS_LAUNCHER_CHANNEL=${url}" >> "${GITHUB_ENV}"

      # Same channels as construct.yaml, so the launcher is built against the
      # stack the installer ships (dui2 is only on the ndevenish channel).
      # The DIALS stack in `host` makes for deep build trees, so keep the build
      # root short enough to stay clear of the Windows MAX_PATH limit.
      - name: Build dials-launcher
        env:
          DIALS_VERSION: ${{ inputs.version }}
          CONDA_BLD_PATH: ${{ runner.os == 'Windows' && 'C:\bld' || format('{0}/bld', runner.temp) }}
        run: |
          conda build conda-recipe \
            -c conda-forge -c https://conda.anaconda.org/ndevenish \
            --output-folder "${LOCAL_CHANNEL_DIR}" --croot "${CONDA_BLD_PATH}"
          ls -lR "${LOCAL_CHANNEL_DIR}"

      - name: Build installers
        env:
          DIALS_VERSION: ${{ inputs.version }}
        run: constructor . --output-dir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.sh
            dist/*.pkg
            dist/*.exe
            dist/*.msi
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: DIALS ${{ inputs.version }}
          draft: true
          files: dist/*
