name: Build installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: DIALS version to build
        required: true
        default: 3.30.1
      dui2_version:
        description: DUI2 release to build (a ccp4/DUI2 tag, without the "v")
        required: true
        default: 2026.9.21

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: macOS x86_64
            os: macos-26-intel
          - name: macOS arm64
            os: macos-latest
          - name: Windows x86_64
            os: windows-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch DIALS LICENSE
        env:
          DIALS_VERSION: ${{ inputs.version }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/dials/dials/v${DIALS_VERSION}/LICENSE" -o LICENSE

      - name: Set up conda with constructor
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true

      # `conda build` is a subcommand plugin of whichever conda is on PATH, so
      # conda-build has to go into base; constructor is a plain executable and
      # goes into the activated environment.
      - name: Install constructor and conda-build
        run: |
          conda install -y -n base conda-build
          conda install -y constructor

      # construct.yaml reads DIALS_LAUNCHER_CHANNEL and DUI2_CHANNEL, so the
      # installer takes dials-launcher and dui2 from the packages built below
      # rather than from anaconda.org. Windows needs a drive-letter
      # file:///D:/... URL.
      - name: Locate local channel
        run: |
          dir="${RUNNER_TEMP}/local-channel"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            url="file:///$(cygpath -m "${dir}")"
          else
            url="file://${dir}"
          fi
          echo "LOCAL_CHANNEL_DIR=${dir}" >> "${GITHUB_ENV}"
          echo "LOCAL_CHANNEL_URL=${url}" >> "${GITHUB_ENV}"
          echo "DIALS_LAUNCHER_CHANNEL=${url}" >> "${GITHUB_ENV}"
          echo "DUI2_CHANNEL=${url}" >> "${GITHUB_ENV}"

      # dui2 is noarch, but building it on every runner keeps each job
      # self-contained. It must be built first: dials-launcher needs it.
      - name: Build dui2
        env:
          DUI2_VERSION: ${{ inputs.dui2_version }}
          CONDA_BLD_PATH: ${{ runner.os == 'Windows' && 'C:\bld' || format('{0}/bld', runner.temp) }}
        run: |
          conda build dui2-recipe -c conda-forge \
            --output-folder "${LOCAL_CHANNEL_DIR}" --croot "${CONDA_BLD_PATH}"

      # The local channel comes first so the launcher is built against the
      # dui2 just built; everything else comes from conda-forge, as in
      # construct.yaml.
      # The DIALS stack in `host` makes for deep build trees, so keep the build
      # root short enough to stay clear of the Windows MAX_PATH limit.
      - name: Build dials-launcher
        env:
          DIALS_VERSION: ${{ inputs.version }}
          CONDA_BLD_PATH: ${{ runner.os == 'Windows' && 'C:\bld' || format('{0}/bld', runner.temp) }}
        run: |
          conda build conda-recipe \
            -c "${LOCAL_CHANNEL_URL}" -c conda-forge \
            --output-folder "${LOCAL_CHANNEL_DIR}" --croot "${CONDA_BLD_PATH}"
          ls -lR "${LOCAL_CHANNEL_DIR}"

      - name: Build installers
        env:
          DIALS_VERSION: ${{ inputs.version }}
        run: constructor . --output-dir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.sh
            dist/*.pkg
            dist/*.exe
            dist/*.msi
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect installers
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: DIALS ${{ inputs.version }}
          draft: true
          files: dist/*
