{% set version = environ.get("DIALS_VERSION", "3.30.1") %}
{# Where dials-launcher comes from. CI builds it from conda-recipe/ into a
   local file:// channel and points this at it; otherwise use the published
   package. #}
{% set launcher_channel = environ.get("DIALS_LAUNCHER_CHANNEL", "DiamondLightSource") %}
name: DIALS
version: "{{ version }}"
channels:
  - "https://conda.anaconda.org/conda-forge/"
  - "https://conda.anaconda.org/ndevenish"
license_file: LICENSE
welcome_image: dials_logo_164x314.png
header_image: dials_header_150x57.png
icon_image: dials_icon_256x256.png
default_prefix: "$HOME/dials/v{{ version }}"  # [unix]
installer_type: all
specs:
  - dials =={{ version }}
  - xia2
  - dui2
  # Ships dialsbin/, setpaths.*, dials_env.* and the menu entry -- the work
  # post.sh/post.bat used to do at install time.
  #
  # Qualified with channel:: rather than adding the launcher channel to
  # `channels` above, deliberately: DiamondLightSource carries packages whose
  # names collide with conda-forge, and this way it is consulted for this one
  # spec only. Everything else, including this package's dependencies, still
  # resolves from conda-forge alone.
  - {{ launcher_channel }}::dials-launcher =={{ version }}
# Restrict shortcut creation to dials-launcher, so no menu entry shipped by a
# dependency is created by accident.
menu_packages:
  - dials-launcher
  - dui2
